name: Build & Deploy

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  KUSTOMIZE_OVERLAY: ${{ vars.KUSTOMIZE_OVERLAY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ secrets.ECR_REGISTRY }}"

      - name: Build images (and smoke test)
        run: |
          set -euxo pipefail
          TAG="${GITHUB_SHA}"
          REG="${{ secrets.ECR_REGISTRY }}"

          docker build --no-cache -f services/fraud_service/Dockerfile    -t "$REG/${{ secrets.ECR_REPO_FRAUD }}:$TAG" .
          docker build --no-cache -f services/recs_service/Dockerfile     -t "$REG/${{ secrets.ECR_REPO_RECS }}:$TAG" .
          docker build --no-cache -f services/forecast_service/Dockerfile -t "$REG/${{ secrets.ECR_REPO_FORECAST }}:$TAG" .
          docker build --no-cache -f services/gateway/Dockerfile          -t "$REG/${{ secrets.ECR_REPO_GATEWAY }}:$TAG" .

          # dashboard must use its folder context (so package.json resolves)
          docker build --no-cache -t "$REG/${{ secrets.ECR_REPO_DASHBOARD }}:$TAG" services/dashboard

          # Smoke tests: fail fast if shared module is missing in the image
          docker run --rm "$REG/${{ secrets.ECR_REPO_FRAUD }}:$TAG" python -c "from services.common.sagemaker_client import invoke_endpoint_raw; print('fraud ok')"
          docker run --rm "$REG/${{ secrets.ECR_REPO_RECS }}:$TAG" python -c "from services.common.sagemaker_client import invoke_endpoint_raw; print('recs ok')"
          docker run --rm "$REG/${{ secrets.ECR_REPO_FORECAST }}:$TAG" python -c "from services.common.sagemaker_client import invoke_endpoint_raw; print('forecast ok')"

      - name: Push images
        run: |
          set -euxo pipefail
          TAG="${GITHUB_SHA}"
          REG="${{ secrets.ECR_REGISTRY }}"

          docker push "$REG/${{ secrets.ECR_REPO_FRAUD }}:$TAG"
          docker push "$REG/${{ secrets.ECR_REPO_RECS }}:$TAG"
          docker push "$REG/${{ secrets.ECR_REPO_FORECAST }}:$TAG"
          docker push "$REG/${{ secrets.ECR_REPO_GATEWAY }}:$TAG"
          docker push "$REG/${{ secrets.ECR_REPO_DASHBOARD }}:$TAG"

      - name: Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl version --client

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Apply namespaces/quotas/limitranges
        run: |
          kubectl apply -f k8s/base/namespaces.yaml
          kubectl apply -f k8s/base/quotas.yaml
          kubectl apply -f k8s/base/limitranges.yaml

      - name: Deploy with kustomize
        run: |
          set -euxo pipefail
          TAG="${GITHUB_SHA}"
          REG="${{ secrets.ECR_REGISTRY }}"
          OVER="k8s/overlays/${KUSTOMIZE_OVERLAY}"

          pushd "$OVER"
          kustomize edit set image \
            FRAUD_IMAGE="$REG/${{ secrets.ECR_REPO_FRAUD }}:$TAG" \
            RECS_IMAGE="$REG/${{ secrets.ECR_REPO_RECS }}:$TAG" \
            FORECAST_IMAGE="$REG/${{ secrets.ECR_REPO_FORECAST }}:$TAG" \
            GATEWAY_IMAGE="$REG/${{ secrets.ECR_REPO_GATEWAY }}:$TAG" \
            DASHBOARD_IMAGE="$REG/${{ secrets.ECR_REPO_DASHBOARD }}:$TAG"
          popd

          kubectl apply -k "$OVER"

      - name: Rollout checks (with debug on failure)
        run: |
          set -e
          check() {
            ns="$1"; dep="$2"; label="$3"
            echo "== rollout $ns/$dep =="
            kubectl -n "$ns" rollout status "deploy/$dep" --timeout=600s || {
              echo "---- describe deploy ----"
              kubectl -n "$ns" describe "deploy/$dep" || true
              echo "---- pods ----"
              kubectl -n "$ns" get pods -l "app=$label" -o wide || true
              echo "---- logs ----"
              kubectl -n "$ns" logs "deploy/$dep" --tail=200 || true
              exit 1
            }
          }
          check fraud fraud fraud
          check recs recs recs
          check forecast forecast forecast
          check platform gateway gateway
          check platform dashboard dashboard

      - name: Health check (gateway)
        run: |
          kubectl -n platform get svc gateway dashboard
          kubectl -n platform run curl --rm -i --restart=Never \
            --image=curlimages/curl:8.5.0 -- \
            sh -c "curl -sf http://gateway/health && curl -sf http://gateway/status"
