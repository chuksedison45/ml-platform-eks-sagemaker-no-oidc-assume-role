apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud
  namespace: fraud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud
  template:
    metadata:
      labels:
        app: fraud
    spec:
      serviceAccountName: fraud-sa
      containers:
        - name: fraud
          image: FRAUD_IMAGE
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fraud-config
            - secretRef:
                name: aws-credentials
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
