apiVersion: apps/v1
kind: Deployment
metadata:
  name: recs
  namespace: recs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recs
  template:
    metadata:
      labels:
        app: recs
    spec:
      serviceAccountName: recs-sa
      containers:
        - name: recs
          image: RECS_IMAGE
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: recs-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
