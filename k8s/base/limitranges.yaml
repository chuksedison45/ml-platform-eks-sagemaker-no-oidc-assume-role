apiVersion: v1
kind: LimitRange
metadata:
  name: lr-team
  namespace: fraud
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "200m"
        memory: "256Mi"
      type: Container
